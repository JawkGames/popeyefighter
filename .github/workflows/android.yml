# Android derlemesi: SADECE elle (Actions > "Android Build" > Run workflow); push'ta çalışmaz
# - Secrets varsa: imzalı AAB (Google Play'e yüklenecek) + imzalı APK
# - Secrets yoksa: imzasız AAB + debug APK (telefona kurup test için)
# versionCode = çalıştırma numarası, her derlemede otomatik artar.
name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor sync (www -> android)
        run: npx cap sync android

      - name: Sürüm bilgisi
        run: |
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> $GITHUB_ENV
          echo "VERSION_NAME=$(grep -oP "OYUN_SURUM='v\K[^']+" www/js/ayar.js)" >> $GITHUB_ENV

      - name: Keystore hazırla (varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi

      - name: Derle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon

      # çıktılar Actions "artifact" deposuna değil Releases'e konur (artifact kotası dolunca build hata veriyordu; Releases bu kotaya sayılmaz).
      - name: Çıktıları Releases'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}-b${{ github.run_number }}"
          mkdir -p cikti
          cp android/app/build/outputs/bundle/release/*.aab "cikti/popeyefighter-${VERSION_NAME}.aab"
          cp android/app/build/outputs/apk/debug/*.apk "cikti/popeyefighter-${VERSION_NAME}-test.apk"
          if [ -f android/app/build/outputs/mapping/release/mapping.txt ]; then cp android/app/build/outputs/mapping/release/mapping.txt "cikti/popeyefighter-${VERSION_NAME}-mapping.txt"; fi   # Play Console > Uygulama paketleri > ReTrace eşleme dosyası
          gh release create "$TAG" cikti/* --target "${{ github.sha }}" --title "Popeye Fighter v${VERSION_NAME} (build ${{ github.run_number }})" --notes "AAB: Google Play'e yüklenecek. APK: telefona kurup test için."
          # sadece son 2 release kalır, eskiler etiketiyle silinir
          gh release list --limit 100 --json tagName --jq '.[2:][].tagName' | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
